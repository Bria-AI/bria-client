fail_fast: true

default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [yaml, json5]
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.29.1
    hooks:
      - id: commitizen
        stages: [commit-msg]
  - repo: local
    hooks:
      # --- Python (packages/python) ---
      - id: ruff-format
        name: Ruff Format
        entry: bash -c 'cd packages/python && uv run ruff format'
        language: system
        types: [python]
        pass_filenames: false
      - id: ruff
        name: Ruff
        entry: bash -c 'cd packages/python && uv run ruff check --fix --exit-non-zero-on-fix'
        language: system
        types: [python]
        pass_filenames: false
      - id: pyright
        name: Pyright
        entry: bash -c 'cd packages/python && uv run --all-groups pyright src tests'
        language: system
        files: ^packages/python/(src|tests)/.*\.py$
        pass_filenames: false
      - id: pyright-examples
        name: Pyright (examples)
        entry: bash -c 'cd packages/python && uv run --all-groups --extra examples pyright examples'
        language: system
        files: ^packages/python/examples/.*\.py$
        pass_filenames: false
      - id: uv-lock-check
        name: Check uv.lock is up to date
        entry: bash -c 'cd packages/python && uv lock --check'
        language: system
        files: ^packages/python/(pyproject\.toml|uv\.lock)$
        pass_filenames: false
      # --- TypeScript (packages/typescript). Requires `npm install` in packages/typescript. ---
      - id: ts-format
        name: Prettier (TypeScript)
        entry: bash -c 'cd packages/typescript && npm run format:check'
        language: system
        files: ^packages/typescript/.*\.(ts|js|json|md)$
        pass_filenames: false
      - id: ts-lint
        name: ESLint (TypeScript)
        entry: bash -c 'cd packages/typescript && npm run lint'
        language: system
        files: ^packages/typescript/.*\.ts$
        pass_filenames: false
      - id: ts-typecheck
        name: Type Check (TypeScript)
        entry: bash -c 'cd packages/typescript && npm run typecheck'
        language: system
        files: ^packages/typescript/.*\.ts$
        pass_filenames: false
