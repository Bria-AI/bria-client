name: Publish TypeScript

on:
  release:
    types: [published]

# TypeScript releases are tagged `@bria-ai/client-vX.Y.Z`.
jobs:
  npm:
    name: Publish to npm
    if: ${{ startsWith(github.event.release.tag_name, '@bria-ai/client') }}
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: typescript
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - name: Upgrade npm for trusted publishing
        # OIDC trusted publishing requires npm >= 11.5.1.
        run: npm install -g npm@latest
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Publish
        # Tokenless OIDC trusted publishing (no NODE_AUTH_TOKEN); npm mints a
        # short-lived credential and attaches provenance automatically.
        run: npm publish --access public
