name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  pull-requests: read
  contents: read

defaults:
  run:
    working-directory: packages/python

jobs:
  # ---------------- Python (packages/python) ----------------
  format:
    name: Python Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Check formatting
        run: uv run ruff format --check

  lint:
    name: Python Lint Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Run linter
        run: uv run --all-groups ruff check

  typecheck:
    name: Python Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Run type checker (core)
        run: uv run --all-groups pyright src tests
      - name: Run type checker (examples)
        run: uv run --all-groups --extra examples pyright examples

  test:
    name: Python Test (${{ matrix.python-version }}, ${{ matrix.os }})
    needs: [format, lint, typecheck]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --group test
      - name: Run unit tests
        run: uv run pytest -m unit

  # ---------------- TypeScript (packages/typescript) ----------------
  typescript:
    name: TypeScript (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["18", "20", "22"]
    defaults:
      run:
        working-directory: packages/typescript
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: packages/typescript/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
