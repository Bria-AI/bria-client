name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  pull-requests: read
  contents: read

defaults:
  run:
    working-directory: python

jobs:
  # Detect which language(s) changed so we only run the relevant jobs. `CI Gate`
  # (below) is the single required check, so path-filtered/skipped jobs never
  # block a PR.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    outputs:
      python: ${{ steps.filter.outputs.python }}
      typescript: ${{ steps.filter.outputs.typescript }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Filter paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            python:
              - 'python/**'
              - '.github/workflows/ci.yml'
            typescript:
              - 'typescript/**'
              - '.github/workflows/ci.yml'

  # ---------------- Python (python/) ----------------
  format:
    name: Format Check
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Check formatting
        run: uv run ruff format --check

  lint:
    name: Lint Check
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Run linter
        run: uv run --all-groups ruff check

  typecheck:
    name: Type Check
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Run type checker (core)
        run: uv run --all-groups pyright src tests
      - name: Run type checker (examples)
        run: uv run --all-groups --extra examples pyright examples

  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --group test
      - name: Run unit tests
        run: uv run pytest -m unit

  # ---------------- TypeScript (typescript/) ----------------
  typescript:
    name: TypeScript (Node ${{ matrix.node-version }})
    needs: changes
    if: ${{ needs.changes.outputs.typescript == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["18", "20", "22"]
    defaults:
      run:
        working-directory: typescript
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Test
        run: npm test

  # Single required check. Passes if every job that ran succeeded; treats
  # skipped (path-filtered) jobs as OK. Make THIS the required status check in
  # branch protection instead of the individual jobs above.
  ci-gate:
    name: CI Gate
    needs: [changes, format, lint, typecheck, test, typescript]
    if: always()
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Verify required jobs succeeded
        run: |
          for r in \
            "${{ needs.changes.result }}" \
            "${{ needs.format.result }}" \
            "${{ needs.lint.result }}" \
            "${{ needs.typecheck.result }}" \
            "${{ needs.test.result }}" \
            "${{ needs.typescript.result }}"; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::A required CI job did not pass (result: $r)"
              exit 1
            fi
          done
          echo "All CI jobs passed or were skipped."
