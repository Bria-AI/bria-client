name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    name: Create Release PRs
    runs-on: ubuntu-latest
    steps:
      # Manifest-driven: reads release-please-config.json + .release-please-manifest.json.
      # packages/python keeps bare `vX.Y.Z` tags (include-component-in-tag: false) so
      # uv-dynamic-versioning and the existing tag lineage are unaffected; packages/typescript
      # tags as `@bria-ai/client-vX.Y.Z`.
      - name: Run release-please
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.TEMP_RELEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
