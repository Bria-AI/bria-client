name: Publish

on:
  release:
    types: [published]

jobs:
  # Python releases are tagged `vX.Y.Z` (no component prefix).
  pypi:
    name: Publish to PyPI
    if: ${{ !startsWith(github.event.release.tag_name, '@bria-ai/client') }}
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      id-token: write
      contents: write
    defaults:
      run:
        working-directory: packages/python
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Build package
        run: uv build
      - name: Publish to PyPI
        env:
          UV_PUBLISH_USERNAME: __token__
          UV_PUBLISH_PASSWORD: ${{ secrets.PYPI_AUTH_TOKEN }}
        run: uv publish
      - name: Upload wheel to release
        uses: softprops/action-gh-release@v2
        with:
          files: packages/python/dist/*.whl

  # TypeScript releases are tagged `@bria-ai/client-vX.Y.Z`.
  npm:
    name: Publish to npm
    if: ${{ startsWith(github.event.release.tag_name, '@bria-ai/client') }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: packages/typescript
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: packages/typescript/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Publish
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
