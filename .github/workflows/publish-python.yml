name: Publish Python

on:
  release:
    types: [published]

# Python releases are tagged `vX.Y.Z` (no component prefix).
jobs:
  pypi:
    name: Publish to PyPI
    if: ${{ startsWith(github.event.release.tag_name, 'v') }}
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      id-token: write
      contents: write
    defaults:
      run:
        working-directory: python
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Build package
        run: uv build
      - name: Publish to PyPI
        env:
          UV_PUBLISH_USERNAME: __token__
          UV_PUBLISH_PASSWORD: ${{ secrets.PYPI_AUTH_TOKEN }}
        run: uv publish
      - name: Upload wheel to release
        uses: softprops/action-gh-release@v2
        with:
          files: python/dist/*.whl
